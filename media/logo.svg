<svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- A pin.

       The control stamps the device's location onto a record, and there is no
       second candidate: the pin is the only shape in this whole account that
       needs no explanation at 16px. A camera was considered for the optional
       photo and rejected, because the photo is the option and the location is
       the control.

       The ramp is the PCFHub mark's own, verbatim, so this sits in the family rather
       than beside it. Declared in userSpaceOnUse and spanning the whole 96
       canvas, so the mark reads as one object lit from the top right.

       Drawn for 32px, and it is the mark in this set with the most headroom:
       the silhouette is unique among the others, so nothing here is holding a
       shape apart from a neighbour.

       Note: no double hyphen may appear in this comment, or the whole document
       fails to parse as XML. -->
  <defs>
    <linearGradient id="geo-stamp-ramp" x1="16" y1="80" x2="80" y2="12" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A684FF"/><stop offset="0.6" stop-color="#7C86FF"/><stop offset="1" stop-color="#00BCFF"/>
    </linearGradient>
  </defs>
  <!-- The pin. -->
  <path d="M48 6 C31 6 18 19.5 18 36 C18 58 48 90 48 90 C48 90 78 58 78 36 C78 19.5 65 6 48 6 Z"
        fill="url(#geo-stamp-ramp)"/>

  <!-- The hole. Held at r 12 so it survives as a hole and not a dot. -->
  <circle cx="48" cy="36" r="12" fill="#F8FAFC"/>
</svg>
